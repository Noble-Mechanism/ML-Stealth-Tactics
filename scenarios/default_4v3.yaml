# Default MVP scenario: 4 F-35 callsigns (ACMI Name=F-35A) vs 3 RedFighter
# Geometry: Blue ingress from south; Red on north CAP / intercept heading south.
# Positions in local ENU meters (origin ≈ 35N, 115W).

name: default_4v3
description: >
  Four generic LO/stealth fighters (Blue) vs three fighters (Red) on a fixed
  intercept presentation. Blue package starts ~40 nm south; Red CAP ~40 nm north.
red_mode: intercept  # intercept | cap

# Spec 3: Red flight aggressiveness a in [0, 1] (spec 4 will draw it):
# a < 1/3 conservative (lock -> drag), < 2/3 middle (support -> beam), else
# aggressive (missile active -> crank). red_defense: false = pre-spec-3 Red.
red_aggressiveness: 0.5
red_defense: true
# Firing doctrines: shoot_assess_shoot | shoot_shoot_assess | legacy
blue_doctrine: shoot_assess_shoot
red_doctrine: shoot_assess_shoot

blue:
  - id: B1
    name: F-35-1
    x: 0
    y: -42000
    alt: 9200
    heading_rad: 0.0          # north
    speed_mps: 260
  - id: B2
    name: F-35-2
    x: 1800
    y: -42800
    alt: 9000
    heading_rad: 0.0
    speed_mps: 260
  - id: B3
    name: F-35-3
    x: -1800
    y: -42800
    alt: 9000
    heading_rad: 0.0
    speed_mps: 260
  - id: B4
    name: F-35-4
