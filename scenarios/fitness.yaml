# Fitness v2 (spec 7; v1 approved by Rusty 2026-09-26, v2 on 2026-10-02:
# Red-alive penalty + participation-gated survival bonus). Edit freely; every run
# records the weights it used (config + checkpoint) and they are part of the
# run's config fingerprint, so `--resume` refuses a run whose weights changed.
# Override per run:  evolve-net --fitness my_weights.yaml --fw blue_loss=-200
#
# Per fight:
#   kills          x kill * (kill_ref_red / n_red)        (100 x 6 / n_red)
#   Blue losses    x blue_loss, or blue_loss_egress if the jet was egressing
#   Blue alive at the time cap x escape, v2: only jets that fired at least
#                  escape_min_shots missiles (participation = firing, not range)
#   Red jets alive and not departed at the end x red_alive (v2)
#   Red jets that left the fight out of missiles (Winchester) and were not
#                  killed x red_winchester_depart (a quarter kill)
#   Blue missiles fired x shot
#   A fight with no Blue shots and no kills scores the loss terms plus
#                  no_engagement (v1.1 fix, Rusty 2026-09-26: closes the runaway hole)
#                  plus (v2) the red_alive penalty
# Per network: mean over its presentations - std_coef x std (population std).
kill: 100.0
kill_ref_red: 6
blue_loss: -150.0
blue_loss_egress: -250.0
# egress = the dying jet's heading was more than this many degrees off the
# bearing to the nearest live Red jet at its last 1 s sample (running away /
# dragging cold). 120 deg keeps beaming (90 deg) out of "egress".
egress_off_deg: 120.0
escape: 10.0
escape_only_at_time_cap: true
# v2: a live Blue jet earns the escape bonus only if it fired at least this
# many missiles (0 = v1: every live jet)
escape_min_shots: 1
red_winchester_depart: 25.0
# v2: per Red jet still alive at the end of the fight. Red that left out of
# missiles (Winchester) is out of the fight, so it does NOT count as alive
# (it earns red_winchester_depart instead); set red_alive_counts_departed:
# true to count it. Also applied in no-engagement fights (a penalty, not a
# reward: otherwise not fighting at all would beat a fight with a loss and
# no kill, -300 vs -392).
red_alive: -40.0
red_alive_counts_departed: false
shot: -2.0
no_engagement_loss_only: true
no_engagement: -300.0
std_coef: 0.2

# Spec 8 D: Blue–Blue deconfliction. A pair is in conflict at a 1 s sample when
# horizontal range < deconflict_nm AND altitude difference < deconflict_alt_ft.
# Each such second adds deconflict_per_s (capped at deconflict_cap per fight).
deconflict_nm: 5.0
deconflict_alt_ft: 5000.0
deconflict_per_s: -1.0
deconflict_cap: -50.0
